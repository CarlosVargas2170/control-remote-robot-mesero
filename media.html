<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>Medios del Robot</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="stylesheet" href="media.css?v=1">
</head>
<body>
  <div class="app media-app">
    <header class="header">
      <div class="header-row">
        <div class="header-left">
          <a class="media-back" href="index.html" title="Volver al panel">←</a>
          <span class="header-logo">📁</span>
          <h1>Audios y GIFs</h1>
        </div>
        <div class="conn-badge" id="mediaStatus">
          <span class="dot" id="mediaDot"></span>
          <span id="mediaStatusText">Backend</span>
        </div>
      </div>
      <nav class="media-tabs" role="tablist">
        <button type="button" class="media-tab active" data-tab="audios" role="tab">🔊 Audios</button>
        <button type="button" class="media-tab" data-tab="emotions" role="tab">😊 Emociones (GIF)</button>
      </nav>
    </header>

    <!-- ═══ AUDIOS ═══ -->
    <section class="media-panel" id="tab-audios">
      <form class="config-card media-form" id="audioForm">
        <div class="block-header">
          <span class="block-icon">⬆️</span>
          <span class="block-title">Subir audio</span>
        </div>
        <label class="media-field">
          <span>Archivo (wav, mp3, ogg, m4a, aac · máx. 20 MB)</span>
          <input type="file" name="file" accept=".wav,.mp3,.ogg,.m4a,.aac,audio/*" required>
        </label>
        <div class="media-row">
          <label class="media-field">
            <span>Código</span>
            <input type="text" name="code" placeholder="promo_cafe" pattern="[a-z0-9_\-]+" maxlength="60" required>
          </label>
          <label class="media-field">
            <span>Categoría</span>
            <select name="category" id="audioCategory" required></select>
          </label>
        </div>
        <label class="media-field">
          <span>Texto que muestra el robot</span>
          <input type="text" name="display_text" placeholder="¡Prueba nuestro café!">
        </label>
        <div class="media-row">
          <label class="media-field">
            <span>Volumen por defecto</span>
            <input type="number" name="default_volume" min="0" max="1" step="0.05" value="1">
          </label>
          <label class="toggle-label media-check">
            <input type="checkbox" name="show_overlay" checked> Mostrar texto en el robot
          </label>
        </div>
        <button class="btn-accent" type="submit">Subir audio</button>
        <p class="hint-text media-form-status" aria-live="polite"></p>
      </form>

      <div class="media-toolbar">
        <input type="search" id="audioSearch" placeholder="Buscar por código o texto...">
        <select id="audioFilter"></select>
      </div>
      <div class="media-list" id="audioList"><p class="hint-text">Cargando audios...</p></div>
    </section>

    <!-- ═══ EMOCIONES ═══ -->
    <section class="media-panel" id="tab-emotions" hidden>
      <form class="config-card media-form" id="emotionForm">
        <div class="block-header">
          <span class="block-icon">⬆️</span>
          <span class="block-title">Subir GIF o video</span>
        </div>
        <label class="media-field">
          <span>Archivo (gif · máx. 10 MB, o mp4/webm/mov · máx. 40 MB, se convierte a GIF)</span>
          <input type="file" name="file" accept=".gif,.mp4,.webm,.mov,image/gif,video/*" required>
        </label>
        <div class="media-row">
          <label class="media-field">
            <span>Código</span>
            <input type="text" name="code" placeholder="wink" pattern="[a-z0-9_\-]+" maxlength="30" required>
          </label>
          <label class="media-field">
            <span>Ícono</span>
            <input type="text" name="icon" placeholder="😉" maxlength="10">
          </label>
        </div>
        <div class="media-row">
          <label class="media-field">
            <span>Nombre</span>
            <input type="text" name="label" placeholder="Guiño" maxlength="40" required>
          </label>
          <label class="media-field">
            <span>Descripción</span>
            <input type="text" name="sub_label" placeholder="Cara divertida" maxlength="60">
          </label>
        </div>
        <label class="media-field media-narrow">
          <span>Orden</span>
          <input type="number" name="sort_order" value="0" step="1">
        </label>
        <button class="btn-accent" type="submit">Subir emoción</button>
        <p class="hint-text media-form-status" aria-live="polite"></p>
      </form>

      <div class="media-list media-grid" id="emotionList"><p class="hint-text">Cargando emociones...</p></div>
    </section>
  </div>

  <script src="api/config.js?v=2"></script>
  <script src="api/client.js?v=2"></script>
  <script src="api/catalog.js?v=2"></script>
  <script src="media.js?v=1"></script>
</body>
</html>
