<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>Medios del Robot</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="stylesheet" href="media.css?v=6">
</head>
<body>
  <div class="app media-app">
    <header class="header">
      <div class="header-row">
        <div class="header-left">
          <a class="media-back" href="index.html" title="Volver al panel">←</a>
          <span class="header-logo">📁</span>
          <h1>Audios y GIFs</h1>
        </div>
        <div class="conn-badge" id="mediaStatus">
          <span class="dot" id="mediaDot"></span>
          <span id="mediaStatusText">Backend</span>
        </div>
      </div>
      <nav class="media-tabs" id="mediaTabs" role="tablist" hidden>
        <button type="button" class="media-tab active" data-tab="audios" role="tab">🔊 Audios</button>
        <button type="button" class="media-tab" data-tab="emotions" role="tab">😊 Emociones (GIF)</button>
      </nav>
    </header>

    <!-- Token de medios: mientras no esté verificado solo se ve este formulario -->
    <form class="config-card media-form" id="mediaTokenForm">
      <label class="media-field">
        <span>🔑 Token de medios</span>
        <input type="password" name="mediaToken" placeholder="Token para subir audios y GIFs" autocomplete="off">
      </label>
      <button type="submit">Verificar token</button>
      <p class="hint-text media-form-status" aria-live="polite"></p>
    </form>

    <div id="mediaLibrary" hidden>
    <button type="button" class="media-lock" id="mediaLock">🔒 Cambiar token</button>

    <!-- ═══ AUDIOS ═══ -->
    <section class="media-panel" id="tab-audios">
      <form class="config-card media-form" id="audioForm">
        <div class="block-header">
          <span class="block-icon">⬆️</span>
          <span class="block-title">Subir audio</span>
        </div>
        <label class="media-field">
          <span>Archivo (wav, mp3, ogg, m4a, aac · máx. 20 MB)</span>
          <input type="file" name="file" accept=".wav,.mp3,.ogg,.m4a,.aac,audio/*" required>
        </label>
        <label class="media-field">
          <span>¿Dónde aparece en el panel?</span>
          <select name="section" id="audioSection" required>
            <option value="greetings">👋 Saludos</option>
            <option value="alerts">⚠️ Alertas</option>
            <option value="sirens">🚨 Sonidos (desplegable Sirenas/sonidos)</option>
          </select>
        </label>
        <div class="media-row">
          <label class="media-field">
            <span id="buttonLabelTitle">Nombre del botón</span>
            <input type="text" name="button_label" placeholder="¿Hola, qué tal?" maxlength="160" required>
          </label>
          <label class="media-field media-short-field">
            <span>Ícono</span>
            <input type="text" name="button_icon" placeholder="🎵" maxlength="10">
          </label>
        </div>
        <label class="media-field">
          <span>Texto en la pantalla del robot <em class="media-optional">(opcional)</em></span>
          <input type="text" name="display_text" placeholder="Déjalo vacío si solo debe sonar">
          <small class="media-help">
            ✍️ <strong>Escríbelo</strong> si el robot debe mostrar un mensaje mientras suena (por ejemplo, un saludo o un aviso).<br>
            🔇 <strong>Déjalo vacío</strong> si solo debe sonar, sin mostrar nada en pantalla (por ejemplo, música o sirenas).
          </small>
        </label>
        <label class="media-field media-narrow">
          <span>Volumen por defecto</span>
          <input type="number" name="default_volume" min="0" max="1" step="0.05" value="1">
        </label>
        <button class="btn-accent" type="submit">Subir audio</button>
        <p class="hint-text media-form-status" aria-live="polite"></p>
        <div class="media-result" id="audioResult"></div>
      </form>
    </section>

    <!-- ═══ EMOCIONES ═══ -->
    <section class="media-panel" id="tab-emotions" hidden>
      <form class="config-card media-form" id="emotionForm">
        <div class="block-header">
          <span class="block-icon">⬆️</span>
          <span class="block-title">Subir GIF o video</span>
        </div>
        <label class="media-field">
          <span>Archivo (gif · máx. 10 MB, o mp4/webm/mov · máx. 40 MB, se convierte a GIF)</span>
          <input type="file" name="file" accept=".gif,.mp4,.webm,.mov,image/gif,video/*" required>
        </label>
        <div class="media-row">
          <label class="media-field">
            <span>Nombre del botón</span>
            <input type="text" name="label" placeholder="Guiño" maxlength="40" required>
          </label>
          <label class="media-field media-short-field">
            <span>Ícono</span>
            <input type="text" name="icon" placeholder="😉" maxlength="10">
          </label>
        </div>
        <label class="media-field">
          <span>Descripción <em class="media-optional">(opcional, se ve debajo del nombre)</em></span>
          <input type="text" name="sub_label" placeholder="Cara divertida" maxlength="60">
        </label>
        <button class="btn-accent" type="submit">Subir emoción</button>
        <p class="hint-text media-form-status" aria-live="polite"></p>
        <div class="media-result" id="emotionResult"></div>
      </form>
    </section>
    </div>
  </div>

  <script src="api/config.js?v=3"></script>
  <script src="api/client.js?v=3"></script>
  <script src="api/catalog.js?v=4"></script>
  <script src="media.js?v=7"></script>
</body>
</html>
