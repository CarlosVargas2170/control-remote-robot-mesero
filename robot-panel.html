<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <title>Qué muestra cada mesero</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="stylesheet" href="media.css?v=9">
</head>
<body>
  <div class="app media-app rp-app">
    <header class="header">
      <div class="header-row">
        <div class="header-left">
          <a class="media-back" href="index.html" title="Volver al panel">←</a>
          <span class="header-logo">🎛️</span>
          <h1>Qué muestra cada mesero</h1>
        </div>
        <div class="conn-badge">
          <span class="dot" id="rpDot"></span>
          <span id="rpStatusText">Backend</span>
        </div>
      </div>
    </header>

    <!-- Selector y buscador: fijos arriba, no se desplazan -->
    <div class="rp-top">
      <div class="rp-toolbar">
        <label class="media-field">
          <span>Mesero</span>
          <select id="rpRobot"></select>
        </label>
        <label class="media-field">
          <span>Copiar la configuración de</span>
          <select id="rpCopyFrom"></select>
        </label>
        <button type="button" class="btn-sm accent" id="rpCopy">Copiar</button>
      </div>
      <div class="rp-toolbar">
        <label class="media-field">
          <span>Buscar botón o sección</span>
          <input type="search" id="rpSearch" placeholder="Ej: café, saludo, brownie..." autocomplete="off">
        </label>
        <div class="rp-summary" id="rpSummary" aria-live="polite"></div>
      </div>
    </div>

    <!-- Lista: es lo único que se desplaza -->
    <main class="rp-body" id="rpBody">
      <p class="media-help">
        Desmarca lo que este mesero <strong>no</strong> debe mostrar. Lo nuevo aparece en todos los meseros hasta
        que lo desmarques. Ocultar un botón oculta también su audio.
      </p>
      <div id="rpEmotionsCard">
        <p class="hint-text">Cargando...</p>
      </div>
      <div id="rpSections"></div>
    </main>

    <div class="rp-actions">
      <button type="button" class="btn-accent" id="rpSave" disabled>Guardar</button>
      <button type="button" class="btn-sm" id="rpReset" disabled>Descartar</button>
      <span class="hint-text media-form-status" id="rpStatus" aria-live="polite"></span>
    </div>
  </div>

  <script src="api/config.js?v=3"></script>
  <script src="api/client.js?v=3"></script>
  <script src="api/robots.js?v=1"></script>
  <script src="api/panel.js?v=2"></script>
  <script src="admin-gate.js?v=1"></script>
  <script src="robot-panel.js?v=4"></script>
</body>
</html>
