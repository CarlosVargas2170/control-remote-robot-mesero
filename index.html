<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d1117">
  <title>Control Mesero Robot</title>
  <link rel="stylesheet" href="style.css?v=11">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app">

    <!-- ═══ HEADER + CONEXIÓN ═══ -->
    <header class="header">
      <div class="header-row">
        <div class="header-left">
          <span class="header-logo">🤖</span>
          <h1>Mesero Robot</h1>
        </div>
        <div class="conn-badge" id="connStatus">
          <span class="dot" id="connDot"></span>
          <span id="connText">Offline</span>
        </div>
      </div>

      <div class="url-bar">
        <div class="url-input-wrap">
          <span class="url-icon">🔌</span>
          <input type="text" id="baseUrl" placeholder="http://IP_DEL_ROBOT:8080" value="http://192.168.21.71:5050">
        </div>
        <button class="btn-connect" onclick="testConnection()">Conectar</button>
      </div>
    </header>

    <!-- ═══ BADGE DE AUDIO ACTIVO ═══ -->
    <div class="audio-live-badge" id="audioLiveBadge" style="display:none">
      <span class="audio-live-dot"></span>
      <span class="audio-live-icon">🔊</span>
      <span class="audio-live-text" id="audioLiveText"></span>
    </div>

    <!-- ═══ SPLIT LAYOUT: CONTROLES + CONSOLA ═══ -->
    <main class="split-layout">

      <!-- ─── Panel izquierdo: Controles (scrollable) ─── -->
      <div class="controls-panel">

        <!-- ─── Control ─── -->
        <section class="block">
          <div class="block-header">
            <span class="block-icon">📡</span>
            <span class="block-title">Detección</span>
          </div>
          <div class="action-grid">
            <button class="action-card" onclick="callEndpoint('POST','/proximity/near')">
              <span class="action-card-icon">👋</span>
              <span class="action-card-label">Cerca</span>
              <span class="action-card-sub">Modo interactivo</span>
            </button>
            <button class="action-card" onclick="callEndpoint('POST','/proximity/away')">
              <span class="action-card-icon">🚶</span>
              <span class="action-card-label">Lejos</span>
              <span class="action-card-sub">Volver a reposo</span>
            </button>
          </div>
        </section>

        <section class="block">
          <div class="block-header">
            <span class="block-icon">🖥️</span>
            <span class="block-title">Pantalla</span>
          </div>
          <div class="action-grid">
            <button class="action-card accent" data-audio="/greet">
              <span class="action-card-icon">🗣️</span>
              <span class="action-card-label">Saludar</span>
              <span class="action-card-sub">Producto + audio</span>
            </button>
            <button class="action-card" onclick="callEndpoint('POST','/product')">
              <span class="action-card-icon">🖼️</span>
              <span class="action-card-label">Producto</span>
              <span class="action-card-sub">Solo imagen</span>
            </button>
            <button class="action-card danger" onclick="callEndpoint('POST','/cancel-payment')">
              <span class="action-card-icon">✖️</span>
              <span class="action-card-label">Cancelar</span>
              <span class="action-card-sub">Cancelar pago</span>
            </button>
          </div>
        </section>

        <!-- ─── Audios ─── -->

        <section class="block">
          <div class="block-header">
            <span class="block-icon">🔊</span>
            <span class="block-title">Audios Kíky</span>
          </div>
          <div class="action-grid cols-3">
            <button class="action-card" onclick="quickPlay('audio/Aqui_tienes_Que_lo_d.wav', 'audio/kiky/Aqui_tienes_Que_lo_d.wav')">
              <span class="action-card-icon">🎂</span>
              <span class="action-card-label">Aquí tienes</span>
              <span class="action-card-sub">¡Que lo disfrutes!</span>
            </button>
            <button class="action-card" onclick="quickPlay('audio/Hola_deseas_un_Brown.wav', 'audio/kiky/Hola deseas un Brown.wav')">
              <span class="action-card-icon">🍫</span>
              <span class="action-card-label">¿Brownie?</span>
              <span class="action-card-sub">Hola, ¿deseas un Brownie?</span>
            </button>
            <button class="action-card" onclick="quickPlay('audio/Hola_deseas_un_Cremo.wav', 'audio/kiky/Hola deseas un Cremo.wav')">
              <span class="action-card-icon">🍰</span>
              <span class="action-card-label">¿3 Leches?</span>
              <span class="action-card-sub">¿Un Cremoso 3 Leches?</span>
            </button>
            <button class="action-card" onclick="quickPlay('audio/Muchas_graacias.wav', 'audio/kiky/Muchas graacias.wav')">
              <span class="action-card-icon">🙏</span>
              <span class="action-card-label">Gracias</span>
              <span class="action-card-sub">Muchas gracias</span>
            </button>
          </div>

          <div class="block-header" style="margin-top:12px">
            <span class="block-icon">🎛️</span>
            <span class="block-title">Audio personalizado</span>
          </div>
          <div class="audio-custom">
            <div class="audio-custom-row">
              <input type="text" id="customAsset" placeholder="Ruta del audio (ej: audio/alerta.wav)" value="audio/question_coffe_old2.wav">
            </div>
            <div class="audio-custom-row split">
              <input type="number" id="customVolume" placeholder="Vol" min="0" max="1" step="0.1" value="1.0">
              <label class="toggle-label">
                <input type="checkbox" id="customForce"> Forzar
              </label>
              <button class="btn-play" onclick="playCustomAudio()">▶️</button>
              <button class="btn-play danger" onclick="stopLocal(); callEndpoint('POST','/audio/stop')" style="background:#f85149">⏹</button>
            </div>
          </div>
        </section>

        <!-- ─── Configuración ─── -->
        <section class="block">
          <div class="block-header">
            <span class="block-icon">⚙️</span>
            <span class="block-title">Configuración</span>
          </div>
          <div class="config-card">
            <button class="btn-outline" onclick="callEndpoint('GET','/config')"> Ver config actual</button>
            <input type="text" id="cfgBaseUrl" placeholder="Base URL del API">
            <input type="text" id="cfgToken" placeholder="Bearer Token">
            <div class="config-row">
              <input type="text" id="cfgMerchantIds" placeholder="Merchant IDs (ej: 1,53,55)">
              <input type="number" id="cfgProductId" placeholder="Product ID">
            </div>
            <button class="btn-accent" onclick="updateConfig()"> Guardar configuracion</button>
          </div>
        </section>

        <!-- ─── Merchants ─── -->
        <section class="block">
          <div class="block-header">
            <span class="block-icon">🏪</span>
            <span class="block-title">Merchants</span>
            <button class="btn-sm accent" onclick="reloadProducts()" style="margin-left:auto">🔄 Recargar</button>
          </div>
          <div class="config-card" id="merchantList">
            <p class="hint-text">Pulsa Conectar para cargar merchants</p>
          </div>
        </section>

        <!-- ─── Productos ─── -->
        <section class="block">
          <div class="block-header">
            <span class="block-icon"></span>
            <span class="block-title">Productos</span>
            <span class="filter-mode-badge" id="filterModeBadge">ALL</span>
          </div>
          <div class="config-card">
            <div class="filter-mode-row">
              <button class="btn-sm mode-btn active" data-mode="all" onclick="setFilterMode('all')">Mostrar todo</button>
              <button class="btn-sm mode-btn" data-mode="blacklist" onclick="setFilterMode('blacklist')">Blacklist</button>
              <button class="btn-sm mode-btn" data-mode="whitelist" onclick="setFilterMode('whitelist')">Whitelist</button>
            </div>
            <div id="productList">
              <p class="hint-text">Carga productos primero</p>
            </div>
          </div>
        </section>

      </div>

      <!-- ─── Panel derecho: Consola (fija, siempre visible) ─── -->
      <div class="console-panel">
        <div class="console-header">
          <div class="console-header-left">
            <span class="block-icon">📟</span>
            <span class="block-title">Consola</span>
          </div>
          <button class="btn-clear" onclick="clearLogs()">Limpiar</button>
        </div>
        <div class="log-box" id="logBody"></div>
      </div>

    </main>

    <footer class="footer">Control Remoto · Mesero Robot</footer>
  </div>

  <script src="app.js?v=10"></script>
</body>
</html>
